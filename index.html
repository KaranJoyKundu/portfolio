<!doctype html>
<html lang="en" data-theme="dark" data-style="a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbfc" />
    <title>Karan Joy Kundu — Electronics &amp; Communication Engineering, KUET</title>

    <!-- Critical font preloads — the serif headline + body face first paint
         without waiting on a swap (keeps LCP < 2.5s on the hero). Vite rewrites
         the hashed asset URLs on build. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/portfolio/assets/instrument-serif-latin-400-normal-DnYpCC2O.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/portfolio/assets/inter-tight-latin-wght-normal-DX-nOvPD.woff2" />
    <meta
      name="description"
      content="Portfolio of Karan Joy Kundu, ECE student at KUET, Bangladesh. Embedded systems, analog electronics, robotics, machine learning."
    />
    <!-- Static social fallback: scrapers without JS read these. React updates
         title/description per route at runtime; og:image stays constant. -->
    <meta
      property="og:title"
      content="Karan Joy Kundu — Electronics &amp; Communication Engineering, KUET"
    />
    <meta
      property="og:description"
      content="Embedded systems, analog electronics, robotics, and machine learning — real builds with honest case studies."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://karanjoykundu.github.io/portfolio/" />
    <meta property="og:image" content="https://karanjoykundu.github.io/portfolio/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      /* Theme + style init before paint: stored preference, else system
         preference; style defaults to A (Instrument Ledger) unless stored B. */
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var systemLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var light = stored ? stored === "light" : systemLight;
          document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
          var storedStyle = localStorage.getItem("style");
          var style = storedStyle === "b" ? "b" : "a";
          if (style !== "a") document.documentElement.setAttribute("data-style", style);
        } catch (e) {
          /* private mode: keep defaults (dark + style A) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
