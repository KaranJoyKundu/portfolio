<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbfc" />
    <title>Karan Joy Kundu — Electronics &amp; Communication Engineering, KUET</title>

    <!-- Critical font preloads — Design B definitive: Fraunces (display) + Geist
         (sans) face first paint without waiting on a swap (keeps LCP < 2.5s on the
         hero). Vite rewrites the hashed asset URLs on build. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/portfolio/assets/fraunces-latin-wght-normal-ukD16Tqj.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/portfolio/assets/geist-sans-latin-400-normal-gapTbOY8.woff2" />
    <meta
      name="description"
      content="Portfolio of Karan Joy Kundu, ECE student at KUET, Bangladesh. Embedded systems, analog electronics, robotics, machine learning."
    />
    <!-- Static social fallback: scrapers without JS read these. React updates
         title/description per route at runtime; og:image stays constant. -->
    <meta
      property="og:title"
      content="Karan Joy Kundu — Electronics &amp; Communication Engineering, KUET"
    />
    <meta
      property="og:description"
      content="Embedded systems, analog electronics, robotics, and machine learning — real builds with honest case studies."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://karanjoykundu.github.io/portfolio/" />
    <meta property="og:image" content="https://karanjoykundu.github.io/portfolio/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      /* Theme init before paint: stored preference, else system
         preference; Design B is the permanent production design. */
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var systemLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var light = stored ? stored === "light" : systemLight;
          document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
        } catch (e) {
          /* private mode: keep default (dark) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
