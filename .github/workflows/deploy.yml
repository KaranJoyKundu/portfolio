name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours — automatic GitHub project discovery.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Automatic GitHub project discovery (Phase 12): runs on the
      # scheduled cadence and manual dispatch; skipped on plain pushes so
      # normal deploys are never blocked by the GitHub API. On failure the
      # step exits non-zero and the deploy is skipped — the last known-good
      # committed catalog stays live.
      - name: Discover GitHub projects (sync)
        if: github.event_name != 'push'
        run: node scripts/sync-github-projects.mjs --out src/content/generated/github-projects.json

      - name: Typecheck, lint, test (incl. WCAG contrast gate + content schemas)
        run: npm run verify
        env:
          VITE_BASE: /portfolio/ # ← single place; must match this repo's subpath

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /portfolio/ # ← single place; see README "Deployment"

      - name: Upload placeholder report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: content-placeholder-report
          path: content-placeholder-report.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
