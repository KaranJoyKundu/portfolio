name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, lint, test (incl. WCAG contrast gate + content schemas)
        run: npm run check
        env:
          VITE_BASE: /portfolio/ # ← single place; must match this repo's subpath

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /portfolio/ # ← single place; see README "Deployment"

      - name: Upload placeholder report
        uses: actions/upload-artifact@v4
        with:
          name: content-placeholder-report
          path: content-placeholder-report.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
