name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every 6 hours — automatic GitHub project discovery.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # PRs run validation only; production deploy stays on push/schedule/dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Automatic GitHub project discovery (Phase 12): runs before EVERY
      # production build (push to main, scheduled, manual). If this step
      # fails the workflow stops before build/deploy, so the live site keeps
      # serving the last known-good catalog (fail safe, never an empty deploy).
      - name: Discover GitHub projects (sync)
        run: node scripts/sync-github-projects.mjs --out src/content/generated/github-projects.json

      - name: Typecheck, lint, test (incl. WCAG contrast gate + content schemas)
        run: npm run verify
        env:
          VITE_BASE: /portfolio/ # ← single place; must match this repo's subpath

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /portfolio/ # ← single place; see README "Deployment"

      - name: Upload placeholder report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: content-placeholder-report
          path: content-placeholder-report.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  pull-request-validation:
    # CI gate for pull requests: sync → verify → build. No Pages deploy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Discover GitHub projects (sync) — PR validation only
        run: node scripts/sync-github-projects.mjs --out src/content/generated/github-projects.json

      - name: Typecheck, lint, test (incl. WCAG contrast gate + content schemas)
        run: npm run verify
        env:
          VITE_BASE: /portfolio/ # ← single place; must match this repo's subpath

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /portfolio/ # ← single place; see README "Deployment"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-build
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
